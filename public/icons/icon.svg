<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Cost Per Use Premium Logo</title>

  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Border Gradient for Squircle -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Progress Arc Gradient -->
    <linearGradient id="arcGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Calculator Body Gradient -->
    <linearGradient id="calculatorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Inner Shadow for Elements -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle (Mac-style rounded icon badge) -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="3" filter="url(#shadowFilter)"/>

  <!-- 2. Cost / Usage Progress Dial -->
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="170" stroke="url(#arcGradient)" stroke-width="20" stroke-linecap="round" stroke-dasharray="780 1068" fill="none" opacity="0.3" transform="rotate(-120 256 256)"/>
  <!-- Inner Bright Arc -->
  <circle cx="256" cy="256" r="170" stroke="url(#arcGradient)" stroke-width="12" stroke-linecap="round" stroke-dasharray="780 1068" fill="none" filter="url(#glowFilter)" transform="rotate(-120 256 256)"/>
  <!-- Bright Core Line -->
  <circle cx="256" cy="256" r="170" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="780 1068" fill="none" opacity="0.9" transform="rotate(-120 256 256)"/>

  <!-- Glowing Dial Ticks/Dots -->
  <circle cx="256" cy="86" r="5" fill="#FFFFFF" filter="url(#glowFilter)"/>
  <circle cx="376" cy="136" r="5" fill="#FFFFFF" filter="url(#glowFilter)"/>
  <circle cx="136" cy="136" r="5" fill="#FFFFFF" filter="url(#glowFilter)"/>

  <!-- 3. Calculator Body -->
  <rect x="250" y="210" width="140" height="170" rx="24" fill="url(#calculatorGradient)" stroke="#475569" stroke-width="2" filter="url(#elementShadow)"/>

  <!-- Calculator Display Screen -->
  <rect x="270" y="235" width="100" height="32" rx="8" fill="#020617" stroke="#06B6D4" stroke-width="1" opacity="0.9"/>
  <!-- Simulated Screen Segments -->
  <path d="M282 251H298M306 251H324M332 251H338" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#glowFilter)"/>

  <!-- Calculator Button Grid -->
  <!-- Row 1 -->
  <rect x="274" y="282" width="24" height="18" rx="6" fill="#3B82F6" opacity="0.9"/>
  <rect x="308" y="282" width="24" height="18" rx="6" fill="#10B981" opacity="0.9"/>
  <rect x="342" y="282" width="24" height="18" rx="6" fill="#EF4444" opacity="0.9"/>
  <!-- Row 2 -->
  <rect x="274" y="310" width="24" height="18" rx="6" fill="#64748B" opacity="0.9"/>
  <rect x="308" y="310" width="24" height="18" rx="6" fill="#64748B" opacity="0.9"/>
  <rect x="342" y="310" width="24" height="18" rx="6" fill="#F59E0B" opacity="0.9"/>
  <!-- Row 3 -->
  <rect x="274" y="338" width="58" height="20" rx="6" fill="#10B981" opacity="0.9"/>
  <rect x="342" y="338" width="24" height="20" rx="6" fill="#64748B" opacity="0.9"/>

  <!-- 4. Dollar Sign (Overlay with 3D shadow effect) -->
  <!-- Dark shadow behind the dollar sign for depth -->
  <path
    d="M245 210C215 185 165 185 165 225C165 270 255 275 255 320C255 360 205 360 175 335"
    stroke="#020617"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.5"
  />
  <path
    d="M210 160V380"
    stroke="#020617"
    stroke-width="28"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- Main glowing Dollar Sign S-curve -->
  <path
    d="M245 210C215 185 165 185 165 225C165 270 255 275 255 320C255 360 205 360 175 335"
    stroke="#FFFFFF"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glowFilter)"
  />
  <!-- Main glowing Dollar Sign Vertical Bar -->
  <path
    d="M210 160V380"
    stroke="#FFFFFF"
    stroke-width="20"
    stroke-linecap="round"
    filter="url(#glowFilter)"
  />
  <!-- Bright Inner Core for Dollar Sign -->
  <path
    d="M245 210C215 185 165 185 165 225C165 270 255 275 255 320C255 360 205 360 175 335"
    stroke="#E0F2FE"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <path
    d="M210 165V375"
    stroke="#E0F2FE"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.9"
  />
</svg>
