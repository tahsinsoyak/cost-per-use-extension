<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Cost Per Use Icon</title>

  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="blueGradient" x1="120" y1="380" x2="390" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="calculatorGradient" x1="300" y1="260" x2="430" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main circular badge -->
  <circle cx="256" cy="256" r="226" fill="url(#bgGradient)" filter="url(#softShadow)"/>

  <!-- Cost / usage progress arc -->
  <path
    d="M291 406C205 423 116 370 91 286C66 202 114 112 199 88C236 78 275 79 309 90"
    stroke="url(#blueGradient)"
    stroke-width="31"
    stroke-linecap="round"
  />

  <!-- Gauge ticks -->
  <path d="M318 88L304 134" stroke="url(#blueGradient)" stroke-width="18" stroke-linecap="round"/>
  <path d="M371 122L341 160" stroke="url(#blueGradient)" stroke-width="18" stroke-linecap="round"/>
  <path d="M414 180L374 201" stroke="url(#blueGradient)" stroke-width="18" stroke-linecap="round"/>
  <path d="M428 242L384 248" stroke="url(#blueGradient)" stroke-width="18" stroke-linecap="round"/>

  <!-- Dollar symbol, drawn as vector strokes (shifted left by 15px to avoid overlapping calculator) -->
  <path
    d="M261 174C242 155 203 152 177 166C149 181 141 214 162 234C181 253 220 257 248 267C287 281 305 303 294 336C283 370 244 386 202 379C169 374 143 357 131 331"
    stroke="#F8FAFC"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M214 139V181M214 376V416"
    stroke="#F8FAFC"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- Calculator body (height increased to 160 to prevent button overflow) -->
  <rect x="306" y="266" width="136" height="160" rx="27" fill="url(#calculatorGradient)"/>

  <!-- Calculator display -->
  <rect x="323" y="291" width="102" height="36" rx="8" fill="#020617" opacity="0.96"/>

  <!-- Calculator buttons (perfectly centered and spaced) -->
  <rect x="334" y="345" width="31" height="27" rx="9" fill="#020617" opacity="0.96"/>
  <rect x="382" y="345" width="31" height="27" rx="9" fill="#020617" opacity="0.96"/>
  <rect x="334" y="385" width="31" height="27" rx="9" fill="#020617" opacity="0.96"/>
  <rect x="382" y="385" width="31" height="27" rx="9" fill="#020617" opacity="0.96"/>
</svg>
