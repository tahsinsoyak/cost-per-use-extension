<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Cost Per Use Icon</title>

  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="blueGradient" x1="58" y1="48" x2="198" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F80FF"/>
      <stop offset="55%" stop-color="#5BB6FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="calculatorGradient" x1="156" y1="132" x2="214" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EC7FF"/>
      <stop offset="100%" stop-color="#2F80FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main badge -->
  <circle cx="128" cy="128" r="112" fill="url(#bgGradient)" filter="url(#softShadow)"/>

  <!-- Usage / cost arc -->
  <path
    d="M135 43
       A86 86 0 1 0 148 207"
    stroke="url(#blueGradient)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Gauge ticks -->
  <path d="M158 55 L151 80" stroke="#4093FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M184 70 L169 89" stroke="#4093FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M204 97 L181 109" stroke="#4093FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M211 126 L187 129" stroke="#4093FF" stroke-width="6" stroke-linecap="round"/>

  <!-- Dollar symbol drawn with vector strokes -->
  <path
    d="M116 69 V88"
    stroke="#F8FAFC"
    stroke-width="13"
    stroke-linecap="round"
  />

  <path
    d="M116 168 V187"
    stroke="#F8FAFC"
    stroke-width="13"
    stroke-linecap="round"
  />

  <path
    d="M146 93
       C139 76 115 70 96 80
       C77 90 78 113 100 120
       L132 130
       C157 138 160 164 139 176
       C116 189 89 181 80 160"
    stroke="#F8FAFC"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Calculator -->
  <rect x="154" y="132" width="62" height="74" rx="13" fill="url(#calculatorGradient)"/>

  <!-- Calculator screen -->
  <rect x="165" y="146" width="40" height="16" rx="4" fill="#020617"/>

  <!-- Calculator buttons -->
  <rect x="167" y="173" width="15" height="15" rx="5" fill="#020617"/>
  <rect x="190" y="173" width="15" height="15" rx="5" fill="#020617"/>
  <rect x="167" y="195" width="15" height="15" rx="5" fill="#020617"/>
  <rect x="190" y="195" width="15" height="15" rx="5" fill="#020617"/>
</svg>
